<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>¿Serías mi pareja?</title>    
</head>
<body>
    <section>
        <div class="video-background" id="videoBg">
            <video autoplay loop muted playsinline>
                <source src="recursos/heart.webm" type="video/webm">
                Tu navegador no soporta el video.
            </video>
        </div>

        <div class="container">
            <div class="image-box">
                <div class="actual-image">
                    <img src="recursos/cat-heart.gif" alt="cat-heart" class="gif" id="gif">
                </div>
                <div class="text-one">
                    <p style="font-size: 1.4rem; text-align: center" id="text">
                        ¿Te gustaría ser mi pareja? 💕
                    </p>
                </div>
            </div>
            
            <div class="yes-no">
                <button class="yes" id="yes">Sí</button>
                <button class="no" id="no">No</button>
            </div>
        </div> 
    </section> <script src="script.js"></script>      
</body>
</html>
